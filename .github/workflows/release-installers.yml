name: Release installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SimpleLoanCalculator.slnx --locked-mode
      - run: dotnet test tests/SimpleLoanCalculator.Core.Tests/SimpleLoanCalculator.Core.Tests.csproj -c Release --no-restore
      - run: dotnet build src/SimpleLoanCalculator.App/SimpleLoanCalculator.App.csproj -c Release --no-restore -p:Platform=x64

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            inno_arch: x64compatible
          - rid: win-arm64
            platform: ARM64
            inno_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish unpackaged self-contained application
        shell: pwsh
        run: |
          dotnet publish src\SimpleLoanCalculator.App\SimpleLoanCalculator.App.csproj `
            -c Release -r '${{ matrix.rid }}' --self-contained true `
            -p:Platform='${{ matrix.platform }}' `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:Version=$env:APP_VERSION `
            -o publish
      - run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "/DAppRuntime=${{ matrix.rid }}" `
            "/DAppArch=${{ matrix.inno_arch }}" `
            packaging\windows\ExactLoanCalculator.iss
      - uses: actions/upload-artifact@v7
        with:
          name: exact-loan-calculator-${{ matrix.rid }}
          path: artifacts/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: exact-loan-calculator-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
